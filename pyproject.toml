[project]
name = "customer_portal"
authors = [{ name = "Apex Softnet", email = "developer@apexsoftnet.com" }]
description = "Hari Bhog customer portal: server-side order creation for portal (Website) users"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
